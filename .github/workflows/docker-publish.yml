name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: ${{ matrix.service.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: bizcord-backend
            image: achrafyoussef/bizcord-backend
          - name: frontend
            context: bizcord-frontend
            image: achrafyoussef/bizcord-frontend
          - name: mediasoup
            context: bizcord-mediasoup
            image: achrafyoussef/bizcord-mediasoup

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract application version
        id: app_version
        shell: bash
        run: |
          if [[ "${{ matrix.service.name }}" == "backend" ]]; then
            version="$(awk '
              /<\/parent>/ { parent_done=1; next }
              parent_done && match($0, /<version>([^<]+)<\/version>/, m) {
                print m[1]
                exit
              }
            ' "${{ matrix.service.context }}/pom.xml")"
          else
            version="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' "${{ matrix.service.context }}/package.json" | head -n 1)"
          fi

          major_minor="$(echo "$version" | cut -d. -f1-2)"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.service.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ steps.app_version.outputs.version }}
            type=raw,value=${{ steps.app_version.outputs.major_minor }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service.context }}
          file: ./${{ matrix.service.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,scope=${{ matrix.service.name }},mode=max
