apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bizcord-minio
  namespace: {{ include "bizcord.namespace" . }}
  labels:
    {{- include "bizcord.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: bizcord-minio-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bizcord-minio
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bizcord-minio
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: minio
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - server
            - /data
            - --console-address
            - ":{{ .Values.minio.ports.console }}"
          ports:
            - name: api
              containerPort: {{ .Values.minio.ports.api }}
              protocol: TCP
            - name: console
              containerPort: {{ .Values.minio.ports.console }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: bizcord-minio-secret
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.minio.pvc.size }}
