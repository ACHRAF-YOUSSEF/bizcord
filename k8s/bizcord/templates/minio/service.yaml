---
# Headless service required by StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: bizcord-minio-headless
  namespace: {{ include "bizcord.namespace" . }}
  labels:
    {{- include "bizcord.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: bizcord-minio
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: {{ .Values.minio.ports.api }}
      targetPort: api
      protocol: TCP
    - name: console
      port: {{ .Values.minio.ports.console }}
      targetPort: console
      protocol: TCP
---
# ClusterIP service — backend uses bizcord-minio:9000
apiVersion: v1
kind: Service
metadata:
  name: bizcord-minio
  namespace: {{ include "bizcord.namespace" . }}
  labels:
    {{- include "bizcord.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bizcord-minio
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: {{ .Values.minio.ports.api }}
      targetPort: api
      protocol: TCP
    - name: console
      port: {{ .Values.minio.ports.console }}
      targetPort: console
      protocol: TCP
