---
# Credential env vars
apiVersion: v1
kind: Secret
metadata:
  name: bizcord-backend-creds
  namespace: {{ include "bizcord.namespace" . }}
  labels:
    {{- include "bizcord.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.backend.secrets.dbPassword | quote }}
  APP_STORAGE_MINIO_ACCESS_KEY: {{ .Values.backend.secrets.minioAccessKey | quote }}
  APP_STORAGE_MINIO_SECRET_KEY: {{ .Values.backend.secrets.minioSecretKey | quote }}
  APP_MEDIASOUP_API_SECRET: {{ .Values.backend.secrets.mediasoupApiSecret | quote }}
  MAIL_USERNAME: {{ .Values.backend.secrets.mailUsername | quote }}
  MAIL_PASSWORD: {{ .Values.backend.secrets.mailPassword | quote }}
---
# JWT RSA key files — mounted as a volume at /app/keys/
apiVersion: v1
kind: Secret
metadata:
  name: bizcord-backend-jwt-keys
  namespace: {{ include "bizcord.namespace" . }}
  labels:
    {{- include "bizcord.labels" . | nindent 4 }}
type: Opaque
data:
  jwtRS256.key: {{ .Values.backend.secrets.jwtPrivateKey | b64enc }}
  jwtRS256.key.pub: {{ .Values.backend.secrets.jwtPublicKey | b64enc }}
